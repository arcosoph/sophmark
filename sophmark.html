<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Markdown Editor with Live HTML Preview — Export HTML & CSS | Sophmark</title>
  <meta name="description" content="Free online Markdown editor. Write Markdown, see live HTML preview. Export your HTML with CSS styles or as plain HTML. Markdown to HTML. Built by Arcosoph.">
  <meta name="keywords" content="sophmark, markdown, md, html, converter, tool, free, markdown to html, md to html, css"> 
  <link rel="canonical" href="https://arcosoph.com/sophmark.html">
  <meta name="author" content="Arcosoph">
  
  <!-- Favicons -->
  <!-- Standard favicon for browsers -->
  <link rel="icon" href="/favicon.ico" sizes="any">

  <!-- PNG icons for specific resolutions -->
  <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png">
  <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png">

  <!-- Shortcut icon for legacy browsers -->
  <link rel="shortcut icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="https://arcosoph.com/https://pub-812e108f164d4805821c37cb3d3810f1.r2.dev/images/arcosoph/logo/Arcosoph_Logo_square.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">

  <!-- KaTeX for math rendering -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>

  <style>
    /* ── Reset ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ed-bg:        #f7f7f5;
      --ed-surface:   #ffffff;
      --ed-surface2:  #f0efec;
      --ed-border:    #e2e0db;
      --ed-border2:   #d0cdc6;
      --ed-text:      #1a1916;
      --ed-text2:     #6b6860;
      --ed-text3:     #9e9b94;
      --ed-accent:    #1a6b3a;
      --ed-accent-s:  #e8f5ee;
      --ed-accent2:   #0f4d28;
      --ed-mono:      'DM Mono', monospace;
      --ed-sans:      'DM Sans', sans-serif;
      --ed-radius:    6px;
      --ed-toolbar-h: 42px;
      --ed-status-h:  26px;
    }
    [data-theme="dark"] {
      --ed-bg:        #141412 !important;
      --ed-surface:   #1e1d1b !important;
      --ed-surface2:  #272521 !important;
      --ed-border:    #2e2c28 !important;
      --ed-border2:   #3a3834 !important;
      --ed-text:      #e8e6e1 !important;
      --ed-text2:     #9e9b94 !important;
      --ed-text3:     #6b6860 !important;
      --ed-accent:    #3dba6e !important;
      --ed-accent-s:  #1a3326 !important;
      --ed-accent2:   #56d484 !important;
    }


    body, html {
      font-family: var(--ed-sans);
      background: var(--ed-bg) !important;
      color: var(--ed-text);
      margin: 0 !important;
      padding: 0 !important;
      /* removed fixed heights and overflow constraints to allow normal page scrolling to footer */
    }

    /* Remove native scrollbars so they don't look weird */
    ::-webkit-scrollbar {
      width: 0px;
      height: 0px;
    }
    
    .show-scrollbar::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    .show-scrollbar::-webkit-scrollbar-thumb {
      background: var(--ed-border2);
      border-radius: 4px;
    }
    .show-scrollbar::-webkit-scrollbar-track {
      background: transparent;
    }

    /* Hide Vertical Scrollbar for Preview Pane */
    .preview-scroll::-webkit-scrollbar {
      width: 0px !important; 
    }

    .editor-layout {
      width: 100%;
      display: flex;
      min-height: calc(100vh - 102px);
    }
    .editor-subbar {
      height: 40px;
      background: var(--ed-surface);
      border-bottom: 1px solid var(--ed-border);
      display: flex;
      align-items: center;
      padding: 0 14px;
      gap: 10px;
      flex-shrink: 0;
    }
    .editor-subbar-title {
      font-size: 12.5px;
      font-weight: 600;
      color: var(--ed-text2);
      letter-spacing: .03em;
    }
    .subbar-sep { width: 1px; height: 18px; background: var(--ed-border2); }
    .subbar-right { margin-left: auto; display: flex; align-items: center; gap: 6px; }
    .sub-btn {
      display: inline-flex; align-items: center; gap: 5px;
      height: 27px; padding: 0 10px;
      border-radius: var(--ed-radius);
      border: 1px solid var(--ed-border2);
      background: var(--ed-surface);
      color: var(--ed-text2);
      font-size: 12px; font-family: var(--ed-sans); font-weight: 500;
      cursor: pointer; transition: all .13s; white-space: nowrap;
    }
    .sub-btn:hover { background: var(--ed-surface2); color: var(--ed-text); }
    .sub-btn.primary { background: var(--ed-accent); color: #fff; border-color: var(--ed-accent); }
    .sub-btn.primary:hover { background: var(--ed-accent2); border-color: var(--ed-accent2); }


    .pane {
      flex: 1 1 0;
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
    }

    .pane + .pane { border-left: 1px solid var(--ed-border); }

    .pane-toolbar {
          height: var(--ed-toolbar-h);
          background: var(--ed-surface);
          border-bottom: 1px solid var(--ed-border);
          display: flex; align-items: center;
          padding: 0 8px; gap: 1px; flex-shrink: 0;
          overflow-x: auto;
          scrollbar-width: none;
        }
        
        /* === EIKHANE NOTUN CODE-TA ADD KORUN === */
        #left-pane .pane-toolbar {
          position: -webkit-sticky; /* For Safari browser */
          position: sticky;
          /* top: 60px; Main navbar-er height */
          top: var(--sophmark-sticky-offset, 0px); 
          z-index: 10;
        }
        /* === NOTUN CODE ADD KORA SHESH === */

        .pane-toolbar::-webkit-scrollbar {
          display: none;
        }

    .pane-label {
      font-size: 10.5px; font-weight: 700;
      letter-spacing: .09em; text-transform: uppercase;
      color: var(--ed-text3); padding: 0 6px; margin-right: 4px;
    }
    .tsep { width: 1px; height: 17px; background: var(--ed-border); margin: 0 3px; }
    .tbtn {
      display: inline-flex; align-items: center; justify-content: center;
      gap: 4px; height: 27px; padding: 0 7px;
      border-radius: var(--ed-radius); border: none;
      background: transparent; color: var(--ed-text2);
      font-size: 11.5px; font-family: var(--ed-sans); font-weight: 500;
      cursor: pointer; transition: all .12s; white-space: nowrap;
    }
    .tbtn:hover { background: var(--ed-surface2); color: var(--ed-text); }
    .tbtn.active { background: var(--ed-accent-s); color: var(--ed-accent); }
    .tbtn svg { flex-shrink: 0; }
    .tright { margin-left: auto; display: flex; align-items: center; gap: 1px; }

    /* .pane-body {
      flex: 1 1 auto; 
      position: relative;
    } */

    .pane-body {
      flex: 1 1 auto;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    #md-input {
      width: 100%;
      flex: 1 1 auto;
      min-height: 400px;
      padding: 20px 22px;

      border: none; outline: none; resize: none;
      background: var(--ed-surface); color: var(--ed-text);
      font-family: var(--ed-mono); font-size: 13.5px; line-height: 1.8;
      tab-size: 2;

    }


    #md-input::placeholder { color: var(--ed-text3); }

    /* highlight overlay on textarea — we use a highlight div instead */
    .editor-highlight-line {
      position: absolute; left: 0; right: 0;
      background: rgba(26, 107, 58, 0.07);
      border-left: 3px solid var(--ed-accent);
      pointer-events: none;
      transition: top .08s, height .08s, opacity .12s;
      opacity: 0;
    }
    [data-theme="dark"] .editor-highlight-line {
      background: rgba(61, 186, 110, 0.09);
    }


    .preview-scroll {
      background: var(--ed-surface);
      padding: 24px 30px;
      flex: 1;
      overflow: auto;
    }

    #html-source-wrap {
      flex: 1; overflow: auto;
      background: var(--ed-surface);
      min-height: 0; display: none;
    }
    #html-source-wrap.visible { display: block; }
    #html-source {
      display: block;
      padding: 20px 22px;
      font-family: var(--ed-mono); font-size: 12.5px;
      line-height: 1.75; color: var(--ed-text);
      white-space: pre; 
    }
    
    .wrap-active #html-source, .wrap-active #html-css-source {
      white-space: pre-wrap !important;
      word-break: break-all !important;
    }
    .wrap-active .md-preview {
      word-break: break-all;
    }
    .wrap-active .md-preview pre {
      white-space: pre-wrap;
      word-break: break-all;
    }


    /* ── Preview typography ── */
    .md-preview { max-width: 100%; }
    .md-preview [data-line] { border-radius: 3px; transition: background .15s; }
    .md-preview [data-line].hovered { background: rgba(26,107,58,.08); }
    [data-theme="dark"] .md-preview [data-line].hovered { background: rgba(61,186,110,.1); }

    .md-preview h1,.md-preview h2,.md-preview h3,
    .md-preview h4,.md-preview h5,.md-preview h6 {
      font-family: var(--ed-sans); font-weight: 600; line-height: 1.3;
      color: var(--ed-text); margin-top: 1.5em; margin-bottom: .45em;
    }
    .md-preview h1 { font-size: 1.85em; border-bottom: 2px solid var(--ed-border); padding-bottom: .3em; margin-top: .5em; }
    .md-preview h2 { font-size: 1.4em;  border-bottom: 1px solid var(--ed-border); padding-bottom: .2em; }
    .md-preview h3 { font-size: 1.15em; }
    .md-preview p  { margin-bottom: .85em; line-height: 1.75; color: var(--ed-text); }
    .md-preview a  { color: var(--ed-accent); text-decoration: underline; text-underline-offset: 2px; }
    .md-preview strong { font-weight: 600; }
    .md-preview em { color: var(--ed-text2); }
    .md-preview del { color: var(--ed-text3); }
    .md-preview hr { border: none; border-top: 1px solid var(--ed-border2); margin: 1.6em 0; }
    .md-preview blockquote {
      border-left: 3px solid var(--ed-accent); margin: 1em 0;
      padding: 9px 15px; background: var(--ed-accent-s);
      border-radius: 0 var(--ed-radius) var(--ed-radius) 0;
      color: var(--ed-text2); font-style: italic;
    }
    .md-preview ul,.md-preview ol { padding-left: 1.4em; margin-bottom: .85em; }
    .md-preview li { margin-bottom: .25em; line-height: 1.65; }
    .md-preview code {
      font-family: var(--ed-mono); font-size: .87em;
      background: var(--ed-surface2); border: 1px solid var(--ed-border);
      border-radius: 4px; padding: .13em .38em; color: var(--ed-accent);
    }
    .md-preview pre {
      background: var(--ed-surface2); border: 1px solid var(--ed-border);
      border-radius: 8px; padding: 15px 18px;
      overflow-x: auto; margin-bottom: .9em;
    }
    .md-preview pre code { background: none; border: none; padding: 0; font-size: .84em; color: var(--ed-text); line-height: 1.65; }
    .md-preview table { width: 100%; border-collapse: collapse; margin-bottom: .9em; font-size: .9em; }
    .md-preview th { background: var(--ed-surface2); border: 1px solid var(--ed-border); padding: 7px 11px; font-weight: 600; text-align: left; }
    .md-preview td { border: 1px solid var(--ed-border); padding: 6px 11px; }
    .md-preview tr:nth-child(even) td { background: var(--ed-surface2); }
    .md-preview img { max-width: 100%; border-radius: var(--ed-radius); }
    .md-preview input[type=checkbox] { margin-right: 5px; accent-color: var(--ed-accent); }

    /* ── Math ── */
    .md-preview .math-block { display: block; overflow-x: auto; margin: 1.2em 0; padding: 10px 0; text-align: center; }
    .md-preview .math-inline { display: inline; }
    .md-preview .katex-display { margin: 0; }

    /* ── Status bar ── */
    .status-bar {
      height: var(--ed-status-h);
      background: var(--ed-surface2); border-top: 1px solid var(--ed-border);
      display: flex; align-items: center;
      padding: 0 12px; gap: 14px;
      font-size: 10.5px; color: var(--ed-text3); flex-shrink: 0;
    }
    .sdot { width: 5px; height: 5px; border-radius: 50%; background: var(--ed-accent); display:inline-block; margin-right:4px; }

    /* ── Custom CSS panel ── */
    .css-panel {
      display: none; flex-direction: column;
      position: fixed; bottom: 0; left: 0; right: 0;
      z-index: 500;
      background: var(--ed-surface);
      border-top: 2px solid var(--ed-accent);
      box-shadow: 0 -4px 24px rgba(0,0,0,.13);
      height: 280px;
      transition: transform .18s ease, opacity .18s ease;
    }
    .css-panel.open { display: flex; }
    .css-panel-hdr {
      height: 36px; display: flex; align-items: center;
      padding: 0 14px; gap: 8px;
      border-bottom: 1px solid var(--ed-border);
      background: var(--ed-surface2);
      font-size: 11px; font-weight: 600; color: var(--ed-text2);
      flex-shrink: 0;
    }
    .css-panel-hdr span { flex: 1; }
    .css-panel-hdr-hint {
      font-size: 10px; font-weight: 400; color: var(--ed-text3);
    }
    .css-x { background: none; border: none; cursor: pointer; color: var(--ed-text3); font-size: 14px; padding: 2px 5px; border-radius: 3px; line-height:1; }
    .css-x:hover { color: var(--ed-text); background: var(--ed-border); }
    #custom-css {
      flex: 1; padding: 10px 14px; border: none; outline: none; resize: none;
      background: var(--ed-surface); color: var(--ed-text);
      font-family: var(--ed-mono); font-size: 12px; line-height: 1.65;
      overflow-y: auto;
    }

    /* ── Toast ── */
    .toast {
      position: fixed; bottom: 22px; left: 50%;
      transform: translateX(-50%) translateY(14px);
      background: var(--ed-text); color: var(--ed-surface);
      padding: 7px 15px; border-radius: 18px;
      font-size: 12px; font-weight: 500;
      opacity: 0; pointer-events: none;
      transition: opacity .18s, transform .18s; z-index: 9999;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    @media (max-width: 680px) {
      .editor-layout { 
        flex-direction: column; 
      }
      .pane + .pane { 
        border-left: none; 
        border-top: 1px solid var(--ed-border); 
      }
      .pane { 
        flex: 1 1 50%; 
        min-height: 0; 
      }
      .pane-body { 
        min-height: 0; 
        flex: 1;
      }
      .preview-scroll { 
        min-height: 0; 
        flex: 1;
      }
      
      /* Subbar fix - buttons wrap */
      .editor-subbar {
        flex-wrap: wrap;
        height: auto;
        padding: 8px 12px;
        gap: 8px;
      }
      
      .subbar-right {
        margin-left: 0;
        flex-wrap: wrap;
        gap: 6px;
      }
      
      .sub-btn {
        font-size: 11px;
        padding: 0 8px;
        height: 30px;
      }
      
      .sub-btn svg {
        width: 11px;
        height: 11px;
      }
    }

    @media (max-width: 550px) {
      .editor-subbar {
        padding: 6px 10px;
      }
      
      .sub-btn {
        font-size: 10px;
        padding: 0 6px;
        height: 28px;
      }
      
      .sub-btn svg {
        width: 10px;
        height: 10px;
      }
      
      .editor-subbar-title {
        font-size: 11px;
      }
    }

    @media (max-width: 480px) {
      .editor-subbar { 
        padding: 6px 8px; 
        gap: 6px;
      }
      .editor-subbar-title { 
        font-size: 10px; 
      }
      .sub-btn { 
        font-size: 9px; 
        padding: 0 5px;
        height: 26px;
      }
      .sub-btn svg {
        width: 9px;
        height: 9px;
      }
      .pane-toolbar { 
        padding: 0 4px; 
      }
      .tbtn { 
        font-size: 10px; 
        padding: 0 4px; 
      }
      #md-input { 
        padding: 12px 14px; 
        font-size: 12.5px; 
      }
      .preview-scroll { 
        padding: 16px 18px; 
      }
    }

    /* ── Line numbers gutter ── */
    .editor-with-gutter {
      display: flex; flex: 1 1 auto; min-height: 0; overflow: hidden;
      position: relative;
    }

    .editor-gutter {
      position: relative;
      width: 40px;
      flex-shrink: 0;
      background: var(--ed-surface2);
      border-right: 1px solid var(--ed-border);
      overflow: hidden;
      user-select: none;
      pointer-events: none;
      z-index: 2;
      box-sizing: border-box;
    }

    /* Canvas fills the gutter — drawn by JS */
    #ed-gutter-canvas {
      display: block;
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      background: var(--ed-surface2);
    }

    /* Textarea gets left padding to make room for the gutter */
    #md-input {
      flex: 1 1 auto; min-height: 0;
    }

    /* ── Multi-cursor overlay ── */
    #mc-overlay {
      position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      pointer-events: none; overflow: hidden;
    }
    .mc-cursor {
      position: absolute; width: 2px;
      background: var(--ed-accent);
      animation: mc-blink 1.1s step-end infinite;
      border-radius: 1px; z-index: 10;
    }
    .mc-selection {
      position: absolute;
      background: rgba(26,107,58,0.18);
      border-radius: 2px; z-index: 9;
    }
    [data-theme="dark"] .mc-selection { background: rgba(61,186,110,0.18); }
    @keyframes mc-blink { 0%,100%{opacity:1} 50%{opacity:0} }

    /* ── Find / Replace panel ── */
    #find-panel {
      display: none; position: fixed; top: 70px; right: 16px; z-index: 1000;
      background: var(--ed-surface);
      border: 1px solid var(--ed-border2);
      border-radius: 8px;
      box-shadow: 0 4px 18px rgba(0,0,0,.18);
      padding: 8px 10px; min-width: 300px;
      font-family: var(--ed-sans); font-size: 12px;
    }
    #find-panel.open { display: block; }
    .fp-row { display: flex; align-items: center; gap: 5px; margin-bottom: 5px; }
    .fp-row:last-child { margin-bottom: 0; }
    .fp-input {
      flex: 1; height: 26px; padding: 0 8px;
      border: 1px solid var(--ed-border2); border-radius: 5px;
      background: var(--ed-surface2); color: var(--ed-text);
      font-family: var(--ed-mono); font-size: 12px; outline: none;
    }
    .fp-input:focus { border-color: var(--ed-accent); }
    .fp-btn {
      height: 26px; padding: 0 8px; border-radius: 5px;
      border: 1px solid var(--ed-border2);
      background: var(--ed-surface2); color: var(--ed-text2);
      font-size: 11px; cursor: pointer; white-space: nowrap;
      font-family: var(--ed-sans);
    }
    .fp-btn:hover { background: var(--ed-border); color: var(--ed-text); }
    .fp-btn.primary { background: var(--ed-accent); color: #fff; border-color: var(--ed-accent); }
    .fp-btn.primary:hover { background: var(--ed-accent2); }
    .fp-count { font-size: 11px; color: var(--ed-text3); min-width: 50px; text-align: center; }
    .fp-close {
      background: none; border: none; cursor: pointer;
      color: var(--ed-text3); font-size: 14px; padding: 0 3px; line-height: 1;
      border-radius: 3px;
    }
    .fp-close:hover { color: var(--ed-text); background: var(--ed-border); }
    .fp-toggle { font-size: 10px; color: var(--ed-text3); cursor: pointer; padding: 2px 5px; border-radius: 3px; }
    .fp-toggle:hover { background: var(--ed-border); color: var(--ed-text); }
    .find-highlight { background: rgba(255,200,0,0.35); border-radius: 2px; }
    .find-highlight.current { background: rgba(255,140,0,0.55); outline: 1px solid orange; }

    /* ── Go-to-line popup ── */
    #goto-panel {
      display: none; position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      z-index: 300; background: var(--ed-surface);
      border: 1px solid var(--ed-border2); border-radius: 8px;
      box-shadow: 0 6px 24px rgba(0,0,0,.18);
      padding: 12px 14px; min-width: 220px;
      font-family: var(--ed-sans); font-size: 12px;
    }
    #goto-panel.open { display: block; }
    #goto-input {
      width: 100%; height: 28px; padding: 0 8px; margin-top: 6px;
      border: 1px solid var(--ed-border2); border-radius: 5px;
      background: var(--ed-surface2); color: var(--ed-text);
      font-family: var(--ed-mono); font-size: 13px; outline: none;
    }
    #goto-input:focus { border-color: var(--ed-accent); }

    /* ── Word wrap toggle indicator ── */
    #btn-wordwrap.active { background: var(--ed-accent-s); color: var(--ed-accent); }

  </style>
</head>
<body>

    <!-- ===== NAVBAR ===== -->
    <div id="navbar-container"></div>


<!-- ════════════════════════════════════════
     EDITOR SUBBAR
═══════════════════════════════════════════ -->
<div class="editor-subbar">
  <span class="editor-subbar-title">Sophmark</span>
  <div class="subbar-sep"></div>
  <span style="font-size:11px;color:var(--ed-text3);">powered by sophmark.js</span>

<!-- sophmark.js -->
<!-- <script src="js/sophmark.js"></script> -->

<script>
// ── Elements ────────────────────────────────
const mdInput        = document.getElementById('md-input');
const preview        = document.getElementById('preview');
const htmlSource     = document.getElementById('html-source');
const previewScroll  = document.getElementById('preview-scroll');
const htmlSourceWrap = document.getElementById('html-source-wrap');
const statWords      = document.getElementById('stat-words');
const statChars      = document.getElementById('stat-chars');
const statLines      = document.getElementById('stat-lines');
const toastEl        = document.getElementById('toast');
const userCssTag     = document.getElementById('user-css-tag');
const cssPanel       = document.getElementById('css-panel');
const customCss      = document.getElementById('custom-css');
const hlLine         = document.getElementById('hl-line');
const editorBody     = document.getElementById('editor-body');
const htmlCssWrap    = document.getElementById('html-css-wrap');

// ── Sophmark custom renderer with line tracking ──
function buildLineTrackedRenderer() {
  const renderer = new sophmark.Renderer();
  const lineMap = [];   // lineMap[i] = md line number (0-based) for rendered block i
  let blockIndex = 0;

  // We approximate line numbers by scanning the markdown
  // Each top-level block gets a data-line attr with its approx start line
  const orig = {};
  ['heading','paragraph','blockquote','list','code','hr','table','html'].forEach(type => {
    orig[type] = renderer[type].bind(renderer);
    renderer[type] = function(token) {
      const result = orig[type](token);
      const lineNum = token._lineNum !== undefined ? token._lineNum : 0;
      // wrap in span with data-line
      return result.replace(/^(<\w[^>]*>)/, (m, tag) => {
        // inject data-line into first opening tag
        return tag.slice(0, -1) + ' data-line="' + lineNum + '">';
      });
    };
  });
  return renderer;
}

// ── Line number injection via walkTokens ────
function addLineNumbers(md) {
  const lines = md.split('\n');
  const tokens = sophmark.lexer(md);
  // We'll do a simple scan: map each token's raw text back to a line number
  let remaining = md;
  let lineNum = 0;
  function tagTokens(tokenList) {
    tokenList.forEach(token => {
      if (!token.raw) return;
      const idx = remaining.indexOf(token.raw);
      if (idx !== -1) {
        // count newlines before this token
        const before = remaining.slice(0, idx);
        lineNum += (before.match(/\n/g) || []).length;
        token._lineNum = lineNum;
        remaining = remaining.slice(idx + token.raw.length);
      }
      if (token.tokens) tagTokens(token.tokens);
      if (token.items) tagTokens(token.items);
    });
  }
  tagTokens(tokens);
  return tokens;
}

// ── Render ──────────────────────────────────

// ── Precise preview→source line mapping ─────────────────────────────────────
//
// Strategy: content-fingerprint matching.
// For each rendered top-level element, extract a "fingerprint" from its
// content (text, alt text, href, etc.), then search the raw markdown for
// the line that best matches that fingerprint. This is immune to block-count
// mismatches between the scanner and the renderer.

function injectDataLines(html, md) {
  const mdLines = md.split('\n');
  // Performance: for large documents skip per-element fingerprint search
  // and use the fast block-line scanner only
  const useFastPath = mdLines.length > FAST_INJECT_THRESHOLD;

  const parser = new DOMParser();
  const doc = parser.parseFromString(`<div id="root">${html}</div>`, 'text/html');
  const root = doc.getElementById('root');
  if (!root) return html;

  const children = Array.from(root.children);
  if (!children.length) return html;

  if (useFastPath) {
    const blockLines = getMarkdownBlockLines(md);
    children.forEach((el, i) => {
      el.setAttribute('data-line', blockLines[i] !== undefined ? blockLines[i] : 0);
    });
  } else {
    children.forEach(el => {
      const lineNum = findSourceLine(el, mdLines);
      el.setAttribute('data-line', lineNum);
    });
  }

  return root.innerHTML;
}

// Extract a search fingerprint from a rendered element.
// Returns { type, text } where text is what to look for in the markdown.
function getElementFingerprint(el) {
  const tag = el.tagName.toLowerCase();

  // Heading — look for the ATX prefix + text
  if (/^h[1-6]$/.test(tag)) {
    return { type: 'heading', level: parseInt(tag[1]), text: el.textContent.trim() };
  }

  // Fenced code block
  if (tag === 'pre') {
    const code = el.querySelector('code');
    const firstLine = (code ? code.textContent : el.textContent).split('\n')[0].trim();
    return { type: 'code', text: firstLine };
  }

  // Blockquote — first non-empty text line
  if (tag === 'blockquote') {
    const text = el.textContent.trim().split('\n')[0].trim();
    return { type: 'blockquote', text };
  }

  // Horizontal rule
  if (tag === 'hr') {
    return { type: 'hr', text: '' };
  }

  // Table — first header cell text
  if (tag === 'table') {
    const th = el.querySelector('th');
    return { type: 'table', text: th ? th.textContent.trim() : '' };
  }

  // List (ul/ol) — text of first list item
  if (tag === 'ul' || tag === 'ol') {
    const li = el.querySelector('li');
    // task list item
    const cb = li ? li.querySelector('input[type=checkbox]') : null;
    const liText = li ? li.textContent.trim().replace(/^\s*/, '') : '';
    return { type: 'list', ordered: tag === 'ol', text: liText, hasCheckbox: !!cb };
  }

  // Image (paragraph containing only an img)
  const imgs = el.querySelectorAll('img');
  if (imgs.length === 1 && el.textContent.trim() === '') {
    return { type: 'image', alt: imgs[0].getAttribute('alt') || '', src: imgs[0].getAttribute('src') || '' };
  }
  if (tag === 'p' && imgs.length >= 1) {
    // paragraph that starts with an image
    const img = imgs[0];
    return { type: 'image', alt: img.getAttribute('alt') || '', src: img.getAttribute('src') || '' };
  }

  // Math block (KaTeX wraps in .katex-display or has class math-block)
  if (el.classList.contains('math-block') || el.querySelector('.katex-display')) {
    return { type: 'math', text: el.textContent.trim().slice(0, 30) };
  }

  // Paragraph — use first ~60 chars of plain text
  if (tag === 'p') {
    return { type: 'paragraph', text: el.textContent.trim().slice(0, 80) };
  }

  // Fallback
  return { type: 'other', text: el.textContent.trim().slice(0, 60) };
}

// Given a fingerprint and the markdown lines array, return the best 0-based line index.
function findSourceLine(el, mdLines) {
  const fp = getElementFingerprint(el);

  switch (fp.type) {

    case 'heading': {
      const prefix = '#'.repeat(fp.level);
      // Exact match first
      for (let i = 0; i < mdLines.length; i++) {
        const t = mdLines[i].trim();
        if (t.startsWith(prefix + ' ') || t.startsWith(prefix + '\t')) {
          const headingText = t.replace(/^#+\s*/, '').replace(/\s+#+\s*$/, '').trim();
          if (headingText === fp.text) return i;
        }
      }
      // Fuzzy: heading text contains fp.text
      for (let i = 0; i < mdLines.length; i++) {
        const t = mdLines[i].trim();
        if (t.startsWith(prefix)) {
          const headingText = t.replace(/^#+\s*/, '').trim();
          if (headingText.toLowerCase().includes(fp.text.toLowerCase().slice(0, 20))) return i;
        }
      }
      // Setext heading
      for (let i = 1; i < mdLines.length; i++) {
        if (/^(=+|-+)\s*$/.test(mdLines[i].trim())) {
          if (mdLines[i - 1].trim().toLowerCase().includes(fp.text.toLowerCase().slice(0, 20))) return i - 1;
        }
      }
      break;
    }

    case 'code': {
      // Find the opening fence line
      for (let i = 0; i < mdLines.length; i++) {
        if (/^(`{3,}|~{3,})/.test(mdLines[i].trim())) {
          // If we have a first-line fingerprint, check the next line
          if (fp.text && i + 1 < mdLines.length) {
            if (mdLines[i + 1].trim().startsWith(fp.text.slice(0, 15))) return i;
          } else {
            return i;
          }
        }
      }
      // Indented code block (4 spaces)
      for (let i = 0; i < mdLines.length; i++) {
        if (mdLines[i].startsWith('    ') && mdLines[i].trim().startsWith(fp.text.slice(0, 10))) return i;
      }
      break;
    }

    case 'blockquote': {
      const needle = fp.text.replace(/^>\s*/, '').slice(0, 30).toLowerCase();
      for (let i = 0; i < mdLines.length; i++) {
        if (/^>/.test(mdLines[i].trim())) {
          const bqText = mdLines[i].replace(/^>\s*/, '').trim().toLowerCase();
          if (needle && bqText.includes(needle.slice(0, 20))) return i;
          if (!needle) return i;
        }
      }
      break;
    }

    case 'hr': {
      for (let i = 0; i < mdLines.length; i++) {
        if (/^([-*_])(\s*\1){2,}\s*$/.test(mdLines[i].trim())) return i;
      }
      break;
    }

    case 'table': {
      // Table lines contain |
      for (let i = 0; i < mdLines.length; i++) {
        if (/\|/.test(mdLines[i])) {
          // Check if the first header cell matches
          const cells = mdLines[i].split('|').map(c => c.trim()).filter(Boolean);
          if (cells.length && fp.text && cells[0].toLowerCase().includes(fp.text.toLowerCase().slice(0, 15))) return i;
          if (!fp.text) return i;
        }
      }
      break;
    }

    case 'list': {
      const firstItemText = fp.text.replace(/^\[[ x]\]\s*/, '').slice(0, 40).toLowerCase();
      const listPrefixRe = fp.ordered ? /^\d+[.)]\s/ : /^[-*+]\s/;
      for (let i = 0; i < mdLines.length; i++) {
        const t = mdLines[i].trim();
        if (listPrefixRe.test(t)) {
          const itemText = t.replace(/^(\d+[.)]\s|[-*+]\s)/, '').replace(/^\[[ x]\]\s*/, '').trim().toLowerCase();
          if (firstItemText && itemText.includes(firstItemText.slice(0, 25))) return i;
          if (!firstItemText) return i;
        }
      }
      break;
    }

    case 'image': {
      // Look for ![alt](src) or ![alt][ref]
      const altNeedle  = fp.alt.slice(0, 30).toLowerCase();
      const srcNeedle  = fp.src.split('/').pop().split('?')[0].toLowerCase(); // filename
      for (let i = 0; i < mdLines.length; i++) {
        const t = mdLines[i];
        if (t.includes('![')) {
          if (altNeedle && t.toLowerCase().includes(altNeedle)) return i;
          if (srcNeedle && t.toLowerCase().includes(srcNeedle)) return i;
        }
      }
      break;
    }

    case 'math': {
      // Look for $$ or \[ math delimiters
      for (let i = 0; i < mdLines.length; i++) {
        const t = mdLines[i].trim();
        if (t.startsWith('$$') || t.startsWith('\\[')) return i;
      }
      break;
    }

    case 'paragraph':
    default: {
      // Use the first meaningful words of the paragraph text to find the source line.
      // Strip markdown syntax from the needle for a clean text search.
      const rawText = fp.text;
      if (!rawText) break;

      // Build a search needle: first 35 chars, lowercased, stripped of common md syntax
      const needle = rawText
        .replace(/[*_`~\[\]()#>]/g, '')  // strip md chars
        .replace(/\s+/g, ' ')
        .trim()
        .toLowerCase()
        .slice(0, 35);

      if (!needle) break;

      let bestLine = -1;
      let bestScore = 0;

      for (let i = 0; i < mdLines.length; i++) {
        const lineText = mdLines[i]
          .replace(/[*_`~\[\]()#>]/g, '')
          .replace(/\s+/g, ' ')
          .trim()
          .toLowerCase();

        if (!lineText) continue;

        // Exact substring match — highest confidence
        if (lineText.includes(needle)) {
          return i;
        }

        // Partial match: count how many words of needle appear in lineText
        const needleWords = needle.split(' ').filter(w => w.length > 3);
        if (needleWords.length) {
          const matches = needleWords.filter(w => lineText.includes(w)).length;
          const score = matches / needleWords.length;
          if (score > bestScore) { bestScore = score; bestLine = i; }
        }
      }

      if (bestScore >= 0.5 && bestLine !== -1) return bestLine;
      break;
    }
  }

  // Last resort: fall back to sequential block-line mapping
  return fallbackBlockLine(el, mdLines);
}

// Fallback: find which sequential block index this element is among its siblings,
// then return the corresponding block line from the scanner.
function fallbackBlockLine(el, mdLines) {
  const siblings = el.parentElement ? Array.from(el.parentElement.children) : [];
  const idx = siblings.indexOf(el);
  const blockLines = getMarkdownBlockLines(mdLines.join('\n'));
  return blockLines[idx] !== undefined ? blockLines[idx] : 0;
}

// Returns an array of 0-based line indices, one per top-level markdown block.
function getMarkdownBlockLines(md) {
  const lines = md.split('\n');
  const blockLines = [];
  let i = 0;
  let inFence = false;
  let fenceChar = '';

  while (i < lines.length) {
    const raw     = lines[i];
    const trimmed = raw.trim();

    if (inFence) {
      const closeMatch = raw.match(/^(\s*)(`{3,}|~{3,})\s*$/);
      if (closeMatch && closeMatch[2][0] === fenceChar && closeMatch[2].length >= 3) inFence = false;
      i++; continue;
    }

    if (trimmed === '') { i++; continue; }

    const fenceMatch = raw.match(/^(\s*)(`{3,}|~{3,})/);
    if (fenceMatch) {
      blockLines.push(i); inFence = true; fenceChar = fenceMatch[2][0]; i++; continue;
    }
    if (/^#{1,6}(\s|$)/.test(trimmed)) { blockLines.push(i); i++; continue; }
    if (/^(=+|-+)\s*$/.test(trimmed) && blockLines.length > 0) { i++; continue; }
    if (/^([-*_])(\s*\1){2,}\s*$/.test(trimmed)) { blockLines.push(i); i++; continue; }

    if (/^>/.test(trimmed)) {
      blockLines.push(i); i++;
      while (i < lines.length && lines[i].trim() !== '') i++;
      continue;
    }
    if (/^[-*+]\s/.test(trimmed)) {
      blockLines.push(i); i++;
      while (i < lines.length) {
        const t = lines[i].trim();
        if (t === '') { if (i+1 < lines.length && /^([-*+]\s|\s{2,})/.test(lines[i+1])) { i++; continue; } break; }
        if (/^[-*+]\s/.test(t) || /^\s{2,}/.test(lines[i])) { i++; continue; }
        break;
      }
      continue;
    }
    if (/^\d+[.)]\s/.test(trimmed)) {
      blockLines.push(i); i++;
      while (i < lines.length) {
        const t = lines[i].trim();
        if (t === '') { if (i+1 < lines.length && /^(\d+[.)]\s|\s{2,})/.test(lines[i+1])) { i++; continue; } break; }
        if (/^\d+[.)]\s/.test(t) || /^\s{2,}/.test(lines[i])) { i++; continue; }
        break;
      }
      continue;
    }
    if (/^</.test(trimmed)) {
      blockLines.push(i); i++;
      while (i < lines.length && lines[i].trim() !== '') i++;
      continue;
    }
    if (/\|/.test(trimmed)) {
      blockLines.push(i); i++;
      while (i < lines.length && /\|/.test(lines[i])) i++;
      continue;
    }

    blockLines.push(i); i++;
    while (i < lines.length) {
      const t = lines[i].trim();
      if (t === '') break;
      if (/^(=+|-+)\s*$/.test(t)) { i++; break; }
      if (/^#{1,6}(\s|$)/.test(t)) break;
      if (/^([-*_])(\s*\1){2,}\s*$/.test(t)) break;
      if (/^>/.test(t)) break;
      if (/^[-*+]\s/.test(t)) break;
      if (/^\d+[.)]\s/.test(t)) break;
      if (/^(`{3,}|~{3,})/.test(t)) break;
      i++;
    }
  }

  return blockLines;
}

// ── Performance: RAF-gated gutter update ─────────────────────
let _gutterRafPending = false;
function scheduleGutter() {
  if (_gutterRafPending) return;
  _gutterRafPending = true;
  requestAnimationFrame(() => { _gutterRafPending = false; updateGutter(); });
}

// ── Performance: throttled scroll handler ────────────────────
function throttle(fn, ms) {
  let last = 0, tid;
  return function(...args) {
    const now = Date.now();
    const remaining = ms - (now - last);
    if (remaining <= 0) { last = now; fn.apply(this, args); }
    else { clearTimeout(tid); tid = setTimeout(() => { last = Date.now(); fn.apply(this, args); }, remaining); }
  };
}

// ── Performance: fast canvas-based line-height measurement cache ──
let _cachedLineHeight = 0;
let _cachedFontSize   = 0;
function getLineHeightFast() {
  const fs = parseFloat(getComputedStyle(mdInput).fontSize);
  if (fs !== _cachedFontSize) { _cachedFontSize = fs; _cachedLineHeight = fs * 1.8; }
  return _cachedLineHeight;
}

// ── Performance: fast char-offset → visual Y (no DOM mirror) ─
// Uses a canvas to measure text widths per line, then accumulates
// visual rows. Accurate for monospace fonts without wrap, and
// gives a good approximation with wrap.
let _fmCanvas, _fmCtx, _fmFont = '';
function getFMCtx() {
  if (!_fmCanvas) { _fmCanvas = document.createElement('canvas'); _fmCtx = _fmCanvas.getContext('2d'); }
  const cs = getComputedStyle(mdInput);
  const font = cs.fontSize + ' ' + cs.fontFamily;
  if (font !== _fmFont) { _fmFont = font; _fmCtx.font = font; }
  return _fmCtx;
}

// Returns the pixel Y (relative to textarea top, scroll-adjusted) for a given logical line index.
// Fast path: no wrap → pure math. Wrap path: canvas measurement per line.
function lineIndexToY(lineIdx, lines) {
  const lh = getLineHeightFast();
  const pt = parseFloat(getComputedStyle(mdInput).paddingTop);
  if (!wordWrapOn) {
    return pt + lineIdx * lh - mdInput.scrollTop;
  }
  // Wrap: measure each line's visual row count using canvas
  const ctx = getFMCtx();
  const availW = mdInput.clientWidth
    - parseFloat(getComputedStyle(mdInput).paddingLeft)
    - parseFloat(getComputedStyle(mdInput).paddingRight);
  let y = pt - mdInput.scrollTop;
  for (let i = 0; i < lineIdx; i++) {
    const lineW = ctx.measureText(lines[i]).width;
    const rows  = Math.max(1, Math.ceil(lineW / availW));
    y += rows * lh;
  }
  return y;
}

        { left: '\\[', right: '\\]', display: true  },
        { left: '\\(', right: '\\)', display: false },
      ],
      throwOnError: false,
    });
  }
}

// ── Layout Height Syncing (Preview dictates height) ─────────────
function alignLayoutHeight() {
   const edLayout = document.querySelector('.editor-layout');
   const previewScroll = document.getElementById('preview-scroll');
   const htmlCssWrap = document.getElementById('html-css-wrap');
   const htmlSourceWrap = document.getElementById('html-source-wrap');
   
   let activeContent = previewScroll;
   if (htmlSourceWrap && htmlSourceWrap.classList.contains('visible')) activeContent = htmlSourceWrap;
   if (htmlCssWrap && htmlCssWrap.style.display === 'block') activeContent = htmlCssWrap;
   
   if (!activeContent) return;

   const minH = window.innerHeight - 102;
   const contentH = activeContent.scrollHeight;
   const totalH = contentH + 42; 
   const targetH = Math.max(minH, totalH);
   
   edLayout.style.height = targetH + 'px';
   updateScrollbarsLogic(); // Refresh markdown conditional scrollbar
}

// ── Conditional Scrollbar & Floating Horizontal ───────────────
let fhCancelled = false;
const fhScroll = document.getElementById('floating-h-scroll');
const fhTrack = document.getElementById('fh-track');
const fhThumb = document.getElementById('fh-thumb');

function updateScrollbarsLogic() {
  // 1. Show markdown scrollbar only if it's taller than preview
  if (mdInput.scrollHeight > previewScroll.scrollHeight) {
    mdInput.classList.add('show-scrollbar');
  } else {
    mdInput.classList.remove('show-scrollbar');
  }

  // 2. Floating horizontal scrollbar logic
  if (fhCancelled) {
    fhScroll.style.display = 'none';
    previewScroll.classList.add('show-scrollbar');
    return;
  }

  const hOverflow = previewScroll.scrollWidth > previewScroll.clientWidth;
  if (hOverflow) {
    fhScroll.style.display = 'flex';
    const ratio = previewScroll.clientWidth / previewScroll.scrollWidth;
    fhThumb.style.width = Math.max(40, ratio * fhTrack.clientWidth) + 'px';
    const maxScroll = previewScroll.scrollWidth - previewScroll.clientWidth;
    const scrRatio = maxScroll > 0 ? previewScroll.scrollLeft / maxScroll : 0;
    const trackSpace = fhTrack.clientWidth - fhThumb.clientWidth;
    fhThumb.style.left = (scrRatio * trackSpace) + 'px';
  } else {
    fhScroll.style.display = 'none';
  }
}

// Draggable thumb logic
let isDraggingFH = false;
let startX = 0;
let startScrollLeft = 0;

fhThumb.addEventListener('mousedown', (e) => {
  isDraggingFH = true;
  startX = e.clientX;
  startScrollLeft = previewScroll.scrollLeft;
  document.body.style.userSelect = 'none';
  fhThumb.style.background = 'var(--ed-accent2)';
});

document.addEventListener('mousemove', (e) => {
  if (!isDraggingFH) return;
  const trackSpace = fhTrack.clientWidth - fhThumb.clientWidth;
  const delta = e.clientX - startX;
  const scrollRatioDelta = delta / trackSpace;
  const maxScroll = previewScroll.scrollWidth - previewScroll.clientWidth;
  previewScroll.scrollLeft = startScrollLeft + (scrollRatioDelta * maxScroll);
});

document.addEventListener('mouseup', () => {
  if (isDraggingFH) {
    isDraggingFH = false;
    document.body.style.userSelect = '';
    fhThumb.style.background = 'var(--ed-accent)';
  }
});

// Click track to jump
fhTrack.addEventListener('click', (e) => {
  if (e.target === fhThumb) return;
  const rect = fhTrack.getBoundingClientRect();
  const clickX = e.clientX - rect.left;
  const ratio = clickX / rect.width;
  const maxScroll = previewScroll.scrollWidth - previewScroll.clientWidth;
  previewScroll.scrollLeft = ratio * maxScroll;
});

// Cancel functionality
document.getElementById('fh-cancel').addEventListener('click', () => {
  fhCancelled = true;
  updateScrollbarsLogic();
});

previewScroll.addEventListener('scroll', updateScrollbarsLogic);

// Highlight bar position: simple math using measured line height.
// Each logical line occupies exactly one lineHeight slot in the gutter
// (the number appears at the top of the line's first visual row).
function getLineTops() {
  const content = mdInput.value;
  const lh      = getLineHeightFast();
  const pt      = parseFloat(getComputedStyle(mdInput).paddingTop);
  const lines   = content.split('\n');
  const tops    = [];
  for (let i = 0; i <= lines.length; i++) {
    tops.push(pt + i * lh);
  }
  return tops;
}

function highlightEditorLine(lineNum) {
  const lines      = mdInput.value.split('\n');
  const targetLine = Math.min(Math.max(lineNum, 0), lines.length - 1);
  const lh         = getLineHeightFast();
  const top        = lineIndexToY(targetLine, lines);

  hlLine.style.left    = '0';
  hlLine.style.top     = top + 'px';
  hlLine.style.height  = lh + 'px';
  hlLine.style.opacity = (top + lh > 0 && top < mdInput.clientHeight) ? '1' : '0';
}
