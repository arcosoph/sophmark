// ── Keyboard Shortcuts & Autocomplete ───────
mdInput.addEventListener('keydown', (e) => {
  const ta = mdInput;
  const s = ta.selectionStart, end = ta.selectionEnd;
  const val = ta.value;
  const hasSelection = s !== end;

  // Helper: replace selection and set cursor
  function replace(newVal, cursorStart, cursorEnd) {
    ta.value = newVal;
    ta.selectionStart = cursorStart;
    ta.selectionEnd = cursorEnd !== undefined ? cursorEnd : cursorStart;
    clearTimeout(renderTimer);
    renderTimer = setTimeout(render, 250);
  }

  // Helper: get line start/end for a position
  function lineStart(pos) { return val.lastIndexOf('\n', pos - 1) + 1; }
  function lineEnd(pos) { const i = val.indexOf('\n', pos); return i === -1 ? val.length : i; }
  function currentLine(pos) { return val.slice(lineStart(pos), lineEnd(pos)); }

  // Helper: wrap selection or word with markers
  function wrapWith(open, close) {
    close = close || open;
    if (hasSelection) {
      const sel = val.slice(s, end);
      replace(val.slice(0, s) + open + sel + close + val.slice(end), s + open.length, end + open.length);
    } else {
      replace(val.slice(0, s) + open + close + val.slice(s), s + open.length);
    }
  }

  // ── Ctrl+B: Bold ──
  if (e.ctrlKey && !e.shiftKey && !e.altKey && e.key === 'b') {
    e.preventDefault();
    wrapWith('**', '**');
    return;
  }

  // ── Ctrl+I: Italic ──
  if (e.ctrlKey && !e.shiftKey && !e.altKey && e.key === 'i') {
    e.preventDefault();
    wrapWith('*', '*');
    return;
  }

  // ── Ctrl+K: Inline code ──
  if (e.ctrlKey && !e.shiftKey && !e.altKey && e.key === 'k') {
    e.preventDefault();
    wrapWith('`', '`');
    return;
  }

  // ── Ctrl+/: Toggle line comment (<!-- --> style for md) ──
  if (e.ctrlKey && !e.shiftKey && !e.altKey && e.key === '/') {
    e.preventDefault();
    const ls = lineStart(s);
    const le = lineEnd(s);
    const line = val.slice(ls, le);
    let newLine, newCursor;
    if (line.startsWith('<!-- ') && line.endsWith(' -->')) {
      newLine = line.slice(5, -4);
      newCursor = s - 5 < ls ? ls : s - 5;
    } else {
      newLine = '<!-- ' + line + ' -->';
      newCursor = s + 5;
    }
    replace(val.slice(0, ls) + newLine + val.slice(le), newCursor);
    return;
  }

  // ── Ctrl+Shift+K: Delete line ──
  if (e.ctrlKey && e.shiftKey && !e.altKey && (e.key === 'K' || e.key === 'k')) {
    e.preventDefault();
    const ls = lineStart(s);
    const le = lineEnd(s);
    let newVal, newCursor;
    if (le < val.length) {
      // line has a newline after it — remove line + trailing newline
      newVal = val.slice(0, ls) + val.slice(le + 1);
      newCursor = Math.min(ls, newVal.length);
    } else if (ls > 0) {
      // last line — remove preceding newline + line
      newVal = val.slice(0, ls - 1);
      newCursor = newVal.length;
    } else {
      // only line
      newVal = '';
      newCursor = 0;
    }
    replace(newVal, newCursor);
    return;
  }

  // ── Ctrl+Enter: Insert line below ──
  if (e.ctrlKey && !e.shiftKey && !e.altKey && e.key === 'Enter') {
    e.preventDefault();
    const le = lineEnd(s);
    replace(val.slice(0, le) + '\n' + val.slice(le), le + 1);
    return;
  }

  // ── Ctrl+Shift+Enter: Insert line above ──
  if (e.ctrlKey && e.shiftKey && !e.altKey && e.key === 'Enter') {
    e.preventDefault();
    const ls = lineStart(s);
    replace(val.slice(0, ls) + '\n' + val.slice(ls), ls + 1);
    return;
  }

  // ── Alt+↑: Move line up ──
  if (e.altKey && !e.ctrlKey && !e.shiftKey && e.key === 'ArrowUp') {
    e.preventDefault();
    const ls = lineStart(s);
    if (ls === 0) return;
    const le = lineEnd(s);
    const prevLs = lineStart(ls - 1);
    const curLine = val.slice(ls, le);
    const prevLine = val.slice(prevLs, ls - 1);
    const newVal = val.slice(0, prevLs) + curLine + '\n' + prevLine + val.slice(le);
    replace(newVal, prevLs + (s - ls));
    return;
  }

  // ── Alt+↓: Move line down ──
  if (e.altKey && !e.ctrlKey && !e.shiftKey && e.key === 'ArrowDown') {
    e.preventDefault();
    const ls = lineStart(s);
    const le = lineEnd(s);
    if (le === val.length) return;
    const nextLe = lineEnd(le + 1);
    const curLine = val.slice(ls, le);
    const nextLine = val.slice(le + 1, nextLe);
    const newVal = val.slice(0, ls) + nextLine + '\n' + curLine + val.slice(nextLe);
    replace(newVal, ls + nextLine.length + 1 + (s - ls));
    return;
  }

  // ── Shift+Alt+↓: Copy line down ──
  if (e.altKey && e.shiftKey && !e.ctrlKey && e.key === 'ArrowDown') {
    e.preventDefault();
    const ls = lineStart(s);
    const le = lineEnd(s);
    const curLine = val.slice(ls, le);
    const newVal = val.slice(0, le) + '\n' + curLine + val.slice(le);
    replace(newVal, le + 1 + (s - ls));
    return;
  }

  // ── Shift+Alt+↑: Copy line up ──
  if (e.altKey && e.shiftKey && !e.ctrlKey && e.key === 'ArrowUp') {
    e.preventDefault();
    const ls = lineStart(s);
    const le = lineEnd(s);
    const curLine = val.slice(ls, le);
    const newVal = val.slice(0, ls) + curLine + '\n' + val.slice(ls);
    replace(newVal, s);
    return;
  }

  // ── Ctrl+L: Select current line ──
  if (e.ctrlKey && !e.shiftKey && !e.altKey && e.key === 'l') {
    e.preventDefault();
    const ls = lineStart(s);
    const le = lineEnd(s);
    ta.selectionStart = ls;
    ta.selectionEnd = le;
    return;
  }

  // ── Ctrl+]: Indent line ──
  if (e.ctrlKey && !e.shiftKey && !e.altKey && e.key === ']') {
    e.preventDefault();
    const ls = lineStart(s);
    replace(val.slice(0, ls) + '  ' + val.slice(ls), s + 2);
    return;
  }

  // ── Ctrl+[: Outdent line ──
  if (e.ctrlKey && !e.shiftKey && !e.altKey && e.key === '[') {
    e.preventDefault();
    const ls = lineStart(s);
    const line = val.slice(ls);
    const spaces = line.match(/^( {1,2}|\t)/);
    if (spaces) {
      const n = spaces[0].length;
      replace(val.slice(0, ls) + val.slice(ls + n), Math.max(ls, s - n));
    }
    return;
  }

  // ── Tab: Indent / autocomplete list ──
  if (e.key === 'Tab' && !e.ctrlKey && !e.altKey) {
    e.preventDefault();
    if (e.shiftKey) {
      // Shift+Tab: outdent
      const ls = lineStart(s);
      const line = val.slice(ls);
      const spaces = line.match(/^( {1,2}|\t)/);
      if (spaces) {
        const n = spaces[0].length;
        replace(val.slice(0, ls) + val.slice(ls + n), Math.max(ls, s - n));
      }
    } else {
      replace(val.slice(0, s) + '  ' + val.slice(end), s + 2);
    }
    return;
  }

  // ── Enter: Auto-continue lists & autocomplete ──
  if (e.key === 'Enter' && !e.ctrlKey && !e.shiftKey && !e.altKey) {
    const ls = lineStart(s);
    const line = val.slice(ls, s);

    // Auto-continue unordered list: "- ", "* ", "+ "
    const ulMatch = line.match(/^(\s*)([-*+] (?:\[[ x]\] )?)/);
    if (ulMatch) {
      // If line only has the prefix, remove it (end the list)
      if (line.trim() === ulMatch[2].trim()) {
        e.preventDefault();
        replace(val.slice(0, ls) + val.slice(s), ls);
        return;
      }
      e.preventDefault();
      const prefix = ulMatch[1] + ulMatch[2].replace(/\[x\] /, '[ ] ');
      replace(val.slice(0, s) + '\n' + prefix + val.slice(end), s + 1 + prefix.length);
      return;
    }

    // Auto-continue ordered list: "1. ", "2. " etc.
    const olMatch = line.match(/^(\s*)(\d+)\. /);
    if (olMatch) {
      if (line.trim() === olMatch[2] + '. ') {
        e.preventDefault();
        replace(val.slice(0, ls) + val.slice(s), ls);
        return;
      }
      e.preventDefault();
      const nextNum = parseInt(olMatch[2], 10) + 1;
      const prefix = olMatch[1] + nextNum + '. ';
      replace(val.slice(0, s) + '\n' + prefix + val.slice(end), s + 1 + prefix.length);
      return;
    }

    // Auto-continue blockquote: "> "
    const bqMatch = line.match(/^(\s*> )/);
    if (bqMatch) {
      if (line.trim() === '>') {
        e.preventDefault();
        replace(val.slice(0, ls) + val.slice(s), ls);
        return;
      }
      e.preventDefault();
      const prefix = bqMatch[1];
      replace(val.slice(0, s) + '\n' + prefix + val.slice(end), s + 1 + prefix.length);
      return;
    }
  }

  // ── Autocomplete pairs ──
  const PAIRS = { '(': ')', '[': ']', '{': '}' };
  const CLOSERS = new Set([')', ']', '}']);

  // Skip over closing bracket if already there
  if (CLOSERS.has(e.key) && !e.ctrlKey && !e.altKey && val[s] === e.key) {
    e.preventDefault();
    ta.selectionStart = ta.selectionEnd = s + 1;
    return;
  }

  // Auto-close brackets
  if (PAIRS[e.key] && !e.ctrlKey && !e.altKey) {
    e.preventDefault();
    const close = PAIRS[e.key];
    if (hasSelection) {
      replace(val.slice(0, s) + e.key + val.slice(s, end) + close + val.slice(end), s + 1, end + 1);
    } else {
      replace(val.slice(0, s) + e.key + close + val.slice(s), s + 1);
    }
    return;
  }

  // Auto-close markdown pairs: **, *, `, ~~, _
  const MD_PAIRS = ['**', '*', '`', '~~', '_'];
  if (e.key === '*' && !e.ctrlKey && !e.altKey) {
    e.preventDefault();
    // Check if next char is also * (for **)
    const nextChar = val[s];
    if (nextChar === '*') {
      // skip over
      ta.selectionStart = ta.selectionEnd = s + 1;
      return;
    }
    if (hasSelection) {
      replace(val.slice(0, s) + '*' + val.slice(s, end) + '*' + val.slice(end), s + 1, end + 1);
    } else {
      replace(val.slice(0, s) + '**' + val.slice(s), s + 1);
    }
    return;
  }

  if (e.key === '`' && !e.ctrlKey && !e.altKey) {
    e.preventDefault();
    if (val[s] === '`' && !hasSelection) {
      ta.selectionStart = ta.selectionEnd = s + 1;
      return;
    }
    if (hasSelection) {
      replace(val.slice(0, s) + '`' + val.slice(s, end) + '`' + val.slice(end), s + 1, end + 1);
    } else {
      replace(val.slice(0, s) + '``' + val.slice(s), s + 1);
    }
    return;
  }

  if (e.key === '_' && !e.ctrlKey && !e.altKey) {
    e.preventDefault();
    if (val[s] === '_' && !hasSelection) {
      ta.selectionStart = ta.selectionEnd = s + 1;
      return;
    }
    if (hasSelection) {
      replace(val.slice(0, s) + '_' + val.slice(s, end) + '_' + val.slice(end), s + 1, end + 1);
    } else {
      replace(val.slice(0, s) + '__' + val.slice(s), s + 1);
    }
    return;
  }

  // Backspace: remove paired char
  if (e.key === 'Backspace' && !hasSelection && !e.ctrlKey && !e.altKey) {
    const prev = val[s - 1], next = val[s];
    const allPairs = { '(': ')', '[': ']', '{': '}', '`': '`', '*': '*', '_': '_' };
    if (prev && allPairs[prev] === next) {
      e.preventDefault();
      replace(val.slice(0, s - 1) + val.slice(s + 1), s - 1);
      return;
    }
  }
});

// ════════════════════════════════════════════════════════════
// ADVANCED EDITOR FEATURES
// ════════════════════════════════════════════════════════════

// ── Line Numbers (canvas-based, pixel-perfect) ───────────────
const edGutter       = document.getElementById('ed-gutter');
const edGutterCanvas = document.getElementById('ed-gutter-canvas');
const edGutterCtx    = edGutterCanvas.getContext('2d');

function updateGutter() {
  const lh    = getLineHeightFast();
  const pt    = parseFloat(getComputedStyle(mdInput).paddingTop);
  const lines = mdInput.value.split('\n');
  const total = lines.length;
  const pos   = mdInput.selectionStart;
  let activeLine = 0, counted = 0;
  for (let i = 0; i < lines.length; i++) {
    counted += lines[i].length + 1;
    if (counted > pos) { activeLine = i; break; }
  }
  const dpr = window.devicePixelRatio || 1;
  const w   = edGutter.clientWidth;
  
  // Back to native bounds
  const h   = edGutter.clientHeight;
  
  if (w === 0 || h === 0) return;
  if (edGutterCanvas.width !== Math.round(w * dpr) || edGutterCanvas.height !== Math.round(h * dpr)) {
    edGutterCanvas.width  = Math.round(w * dpr);
    edGutterCanvas.height = Math.round(h * dpr);
    edGutterCanvas.style.width  = w + 'px';
    edGutterCanvas.style.height = h + 'px';
    edGutterCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  const cs       = getComputedStyle(document.documentElement);
  const bgColor  = getComputedStyle(edGutter).backgroundColor;
  const dimColor = cs.getPropertyValue('--ed-text3').trim();
  const actColor = cs.getPropertyValue('--ed-accent').trim();
  const taStyle  = getComputedStyle(mdInput);
  const fontSize = parseFloat(taStyle.fontSize) * 0.78;
  const rightPad = 6;
  edGutterCtx.fillStyle = bgColor;
  edGutterCtx.fillRect(0, 0, w, h);
  
  const scrollTop = mdInput.scrollTop;

  if (!wordWrapOn) {
    // Fast path: no wrap — pure math, no DOM mirror needed
    const firstVisible = Math.max(0, Math.floor((scrollTop - pt) / lh));
    const lastVisible  = Math.min(total - 1, Math.ceil((scrollTop + h - pt) / lh));
    for (let i = firstVisible; i <= lastVisible; i++) {
      const y        = pt + i * lh - scrollTop;
      const baseline = y + (lh + fontSize * 0.75) / 2;
      edGutterCtx.fillStyle = (i === activeLine) ? actColor : dimColor;
      edGutterCtx.font      = (i === activeLine ? '600 ' : '500 ') + fontSize + 'px ' + taStyle.fontFamily;
      edGutterCtx.textAlign = 'right';
      edGutterCtx.fillText(i + 1, w - rightPad, baseline);
    }
  } else {
    // Wrap path: use canvas font measurement (fast) instead of DOM mirror
    const fmCtx = getFMCtx();
    const availW = mdInput.clientWidth
      - parseFloat(taStyle.paddingLeft)
      - parseFloat(taStyle.paddingRight);
    let y = pt - scrollTop;
    for (let i = 0; i < total; i++) {
      const lineW = fmCtx.measureText(lines[i]).width;
      const rows  = Math.max(1, Math.ceil(lineW / availW));
      const rowH  = rows * lh;
      // Only draw if visible
      if (y + rowH >= 0 && y <= h) {
        const baseline = y + (lh + fontSize * 0.75) / 2;
        edGutterCtx.fillStyle = (i === activeLine) ? actColor : dimColor;
        edGutterCtx.font      = (i === activeLine ? '600 ' : '500 ') + fontSize + 'px ' + taStyle.fontFamily;
        edGutterCtx.textAlign = 'right';
        edGutterCtx.fillText(i + 1, w - rightPad, baseline);
      }
      y += rowH;
      if (y > h) break; // past visible area, stop early
    }
  }
}

mdInput.addEventListener('scroll', throttle(updateGutter, 16));
mdInput.addEventListener('keyup',  scheduleGutter);
mdInput.addEventListener('click',  scheduleGutter);
mdInput.addEventListener('select', scheduleGutter);
mdInput.addEventListener('input',  scheduleGutter);

// ── Word Wrap Toggle ─────────────────────────────────────────
let wordWrapOn = true;
const btnWordwrap = document.getElementById('btn-wordwrap');
btnWordwrap.classList.add('active');
btnWordwrap.addEventListener('click', () => {
  wordWrapOn = !wordWrapOn;
  mdInput.style.whiteSpace = wordWrapOn ? 'pre-wrap' : 'pre';
  mdInput.style.overflowX  = wordWrapOn ? 'hidden' : 'auto';
  btnWordwrap.classList.toggle('active', wordWrapOn);
  // Redraw everything that depends on line positions
  requestAnimationFrame(() => {
    updateGutter();
    if (mcCursors.length) renderMCOverlay();
    if (highlightEditorLine._lastLine != null) highlightEditorLine(highlightEditorLine._lastLine);
  });
});

// ── Find / Replace ───────────────────────────────────────────
const findPanel       = document.getElementById('find-panel');
const fpFind          = document.getElementById('fp-find');
const fpReplace       = document.getElementById('fp-replace');
const fpCount         = document.getElementById('fp-count');
const fpCase          = document.getElementById('fp-case');
const fpRegex         = document.getElementById('fp-regex');
const fpWord          = document.getElementById('fp-word');
const fpReplaceRow    = document.getElementById('fp-replace-row');
const fpToggleReplace = document.getElementById('fp-toggle-replace');

let findMatches = [];
let findCurrent = -1;

function buildFindRegex() {
  let q = fpFind.value;
  if (!q) return null;
  try {
    if (!fpRegex.checked) q = q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    if (fpWord.checked)   q = '\\b' + q + '\\b';
    return new RegExp(q, fpCase.checked ? 'g' : 'gi');
  } catch { return null; }
}

function runFind() {
  const re = buildFindRegex();
  findMatches = [];
  if (!re) { fpCount.textContent = ''; return; }
  const val = mdInput.value;
  let m;
  while ((m = re.exec(val)) !== null) {
    findMatches.push({ start: m.index, end: m.index + m[0].length });
    if (findMatches.length > 5000) break;
  }
  fpCount.textContent = findMatches.length
    ? (Math.min(findCurrent + 1, findMatches.length)) + '/' + findMatches.length
    : 'No results';
  if (findCurrent >= findMatches.length) findCurrent = findMatches.length - 1;
}

function findNav(dir) {
  runFind();
  if (!findMatches.length) return;
  findCurrent = (findCurrent + dir + findMatches.length) % findMatches.length;
  const m = findMatches[findCurrent];
  mdInput.focus();
  mdInput.setSelectionRange(m.start, m.end);
  const linesBefore = mdInput.value.slice(0, m.start).split('\n').length - 1;
  mdInput.scrollTop = Math.max(0, linesBefore * getLineHeightFast() - mdInput.clientHeight / 2);
  fpCount.textContent = (findCurrent + 1) + '/' + findMatches.length;
}

function openFind(withReplace) {
  findPanel.classList.add('open');
  fpReplaceRow.style.display = withReplace ? 'flex' : 'none';
  fpFind.focus();
  fpFind.select();
  const sel = mdInput.value.slice(mdInput.selectionStart, mdInput.selectionEnd);
  if (sel && !sel.includes('\n')) fpFind.value = sel;
  runFind();
}

function closeFind() {
  findPanel.classList.remove('open');
  mdInput.focus();
  findMatches = [];
  findCurrent = -1;
  fpCount.textContent = '';
}

document.getElementById('btn-find').addEventListener('click', () => openFind(false));
document.getElementById('fp-close').addEventListener('click', closeFind);
document.getElementById('fp-next').addEventListener('click', () => findNav(1));
document.getElementById('fp-prev').addEventListener('click', () => findNav(-1));
fpFind.addEventListener('input',  () => { findCurrent = -1; runFind(); });
fpCase.addEventListener('change', () => { findCurrent = -1; runFind(); });
fpRegex.addEventListener('change',() => { findCurrent = -1; runFind(); });
fpWord.addEventListener('change', () => { findCurrent = -1; runFind(); });

fpFind.addEventListener('keydown', (e) => {
  if (e.key === 'Enter')  { e.preventDefault(); findNav(e.shiftKey ? -1 : 1); }
  if (e.key === 'Escape') closeFind();
});
fpReplace.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeFind();
});
fpToggleReplace.addEventListener('click', () => {
  const isOpen = fpReplaceRow.style.display !== 'none';
  fpReplaceRow.style.display = isOpen ? 'none' : 'flex';
  if (!isOpen) fpReplace.focus();
});

document.getElementById('fp-replace-one').addEventListener('click', () => {
  runFind();
  if (!findMatches.length) return;
  if (findCurrent < 0) findCurrent = 0;
  const m   = findMatches[findCurrent];
  const rep = fpReplace.value;
  mdInput.value = mdInput.value.slice(0, m.start) + rep + mdInput.value.slice(m.end);
  mdInput.setSelectionRange(m.start, m.start + rep.length);
  findCurrent = -1;
  runFind();
  clearTimeout(renderTimer); renderTimer = setTimeout(render, 250);
});

document.getElementById('fp-replace-all').addEventListener('click', () => {
  const re = buildFindRegex();
  if (!re) return;
  mdInput.value = mdInput.value.replace(re, fpReplace.value);
  findCurrent = -1;
  runFind();
  clearTimeout(renderTimer); renderTimer = setTimeout(render, 250);
  showToast('Replaced ' + findMatches.length + ' occurrences');
});

document.getElementById('fp-all').addEventListener('click', () => {
  runFind();
  if (!findMatches.length) return;
  mcCursors = findMatches.map(m => ({ start: m.start, end: m.end }));
  mcActive  = 0;
  mdInput.setSelectionRange(findMatches[0].start, findMatches[0].end);
  renderMCOverlay();
  closeFind();
  showToast(findMatches.length + ' selections');
});

// ── Go to Line ───────────────────────────────────────────────
const gotoPanel = document.getElementById('goto-panel');
const gotoInput = document.getElementById('goto-input');

function openGoto() {
  gotoPanel.classList.add('open');
  gotoInput.value = '';
  gotoInput.focus();
}
function closeGoto() {
  gotoPanel.classList.remove('open');
  mdInput.focus();
}
gotoInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    const n = parseInt(gotoInput.value, 10);
    if (!isNaN(n) && n > 0) {
      const lines  = mdInput.value.split('\n');
      const target = Math.min(n - 1, lines.length - 1);
      let pos = 0;
      for (let i = 0; i < target; i++) pos += lines[i].length + 1;
      mdInput.setSelectionRange(pos, pos);
      mdInput.scrollTop = Math.max(0, target * getLineHeightFast() - mdInput.clientHeight / 2);
      scheduleGutter();
    }
    closeGoto();
  }
  if (e.key === 'Escape') closeGoto();
});

// ── Mirror-div helper: char offset → {x, y, h} in textarea coords ──────────
// The mirror div replicates textarea layout. Key insight for wrap mode:
// - mirror must NOT clip (overflow:visible, height:auto) so all wrapped lines
//   are laid out at their true positions
// - we then subtract scrollTop ourselves to get viewport-relative coords
(function buildMirror() {
  const mirror = document.createElement('div');
  mirror.id = 'mc-mirror';
  Object.assign(mirror.style, {
    position:      'absolute',
    top:           '0',
    left:          '0',
    visibility:    'hidden',
    pointerEvents: 'none',
    overflow:      'visible',   // must NOT clip — content taller than textarea
    whiteSpace:    'pre-wrap',
    wordBreak:     'break-word',
    boxSizing:     'border-box',
  });
  mdInput.parentElement.appendChild(mirror);
  window._mcMirror = mirror;
}());

function syncMirrorStyles() {
  const m  = window._mcMirror;
  const cs = getComputedStyle(mdInput);
  // Width must match exactly so line-wrapping happens at the same column
  m.style.width         = mdInput.offsetWidth  + 'px';
  // Height: auto so content isn't clipped in wrap mode
  m.style.height        = 'auto';
  m.style.fontFamily    = cs.fontFamily;
  m.style.fontSize      = cs.fontSize;
  m.style.fontWeight    = cs.fontWeight;
  m.style.lineHeight    = cs.lineHeight;
  m.style.letterSpacing = cs.letterSpacing;
  m.style.paddingTop    = cs.paddingTop;
  m.style.paddingRight  = cs.paddingRight;
  m.style.paddingBottom = cs.paddingBottom;
  m.style.paddingLeft   = cs.paddingLeft;
  m.style.borderTop     = cs.borderTop;
  m.style.borderRight   = cs.borderRight;
  m.style.borderBottom  = cs.borderBottom;
  m.style.borderLeft    = cs.borderLeft;
  m.style.tabSize       = cs.tabSize;
  m.style.whiteSpace    = wordWrapOn ? 'pre-wrap' : 'pre';
}

function offsetToRect(offset) {
  const m   = window._mcMirror;
  syncMirrorStyles();
  const val = mdInput.value;
  function esc(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
  const before = esc(val.slice(0, offset));
  const after  = esc(val.slice(offset));
  m.innerHTML  = before + '<span id="mc-caret">\u200b</span>' + after;
  // Do NOT set m.scrollTop — mirror is not scrolled, we subtract scrollTop manually
  const caret  = m.querySelector('#mc-caret');
  const cr     = caret.getBoundingClientRect();
  const mr     = m.getBoundingClientRect();
  return {
    x: cr.left - mr.left,
    // Subtract textarea scrollTop so result is in viewport (textarea-client) coords
    y: (cr.top - mr.top) - mdInput.scrollTop,
    h: getLineHeight(),
  };
}

// ── Multi-Cursor Engine ──────────────────────────────────────
// mcCursors: array of { start, end }  (start===end = collapsed)
// The textarea's native selection always tracks mcCursors[mcActive].
let mcCursors = [];
let mcActive  = 0;
const mcOverlay = document.getElementById('mc-overlay');

function clearMC() {
  mcCursors = [];
  mcOverlay.innerHTML = '';
}

function renderMCOverlay() {
  if (!mcCursors.length) { mcOverlay.innerHTML = ''; return; }
  // Position the overlay to cover the textarea exactly
  const ta   = mdInput;
  const taR  = ta.getBoundingClientRect();
  const parR = mcOverlay.parentElement.getBoundingClientRect();
  mcOverlay.style.left   = (taR.left - parR.left) + 'px';
  mcOverlay.style.top    = (taR.top  - parR.top)  + 'px';
  mcOverlay.style.width  = taR.width  + 'px';
  mcOverlay.style.height = taR.height + 'px';

  const lh  = getLineHeight();
  const val = ta.value;
  let html  = '';

  mcCursors.forEach((cur) => {
    const s  = Math.min(cur.start, cur.end);
    const en = Math.max(cur.start, cur.end);

    if (s !== en) {
      // Draw selection highlight row-by-row using offsetToRect.
      // Walk char by char through the selection, grouping chars on the same visual row.
      let pos = s;
      while (pos < en) {
        const rowStart = offsetToRect(pos);
        // Find the last char still on this visual row
        let rowEnd = pos;
        let nextPos = pos + 1;
        while (nextPos <= en) {
          const r = offsetToRect(nextPos);
          if (Math.abs(r.y - rowStart.y) > lh * 0.5) break; // moved to next row
          rowEnd = nextPos;
          nextPos++;
        }
        const rowEndRect = offsetToRect(rowEnd);
        const x1 = rowStart.x;
        const x2 = (rowEnd === en && rowEndRect.x > x1) ? rowEndRect.x
                   : (rowEnd < val.length && offsetToRect(rowEnd).y === rowStart.y)
                     ? rowEndRect.x
                     : ta.clientWidth - parseFloat(getComputedStyle(ta).paddingRight);
        if (x2 > x1) {
          html += '<div class="mc-selection" style="left:' + x1 + 'px;top:' + rowStart.y + 'px;width:' + (x2 - x1) + 'px;height:' + lh + 'px"></div>';
        }
        pos = rowEnd;
        if (pos === en) break;
      }
    }

    // Cursor bar
    const caretOffset = (s === en) ? s : en;
    const cr = offsetToRect(caretOffset);
    html += '<div class="mc-cursor" style="left:' + cr.x + 'px;top:' + cr.y + 'px;height:' + cr.h + 'px"></div>';
  });

  mcOverlay.innerHTML = html;
}

// ── Click-position helper: mouse event → textarea char offset ───────────────
function mouseEventToOffset(e) {
  syncMirrorStyles();
  const val   = mdInput.value;
  const total = val.length;
  if (total === 0) return 0;

  const mr   = window._mcMirror.getBoundingClientRect();
  const relX = e.clientX - mr.left;
  // relY in mirror-content space: mouse Y relative to mirror top, plus scrollTop
  // (mirror is not scrolled, so content above the viewport is at negative visual Y
  //  but positive content Y = scrollTop + viewport-relative Y)
  const relY = e.clientY - mr.top + mdInput.scrollTop;

  if (!wordWrapOn) {
    // Fast path: no wrap — use line-height math to find row, then binary search column
    const lh  = getLineHeight();
    const pt  = parseFloat(getComputedStyle(mdInput).paddingTop);
    const row = Math.max(0, Math.floor((relY - pt) / lh));
    const lines = val.split('\n');
    const lineIdx = Math.min(row, lines.length - 1);
    const line    = lines[lineIdx];
    let lineStartOffset = 0;
    for (let i = 0; i < lineIdx; i++) lineStartOffset += lines[i].length + 1;
    let lo = 0, hi = line.length;
    while (lo < hi) {
      const mid = (lo + hi + 1) >> 1;
      const r   = offsetToRect(lineStartOffset + mid);
      // offsetToRect returns viewport-relative y; convert back to content y
      if (r.x <= relX) lo = mid; else hi = mid - 1;
    }
    if (lo < line.length) {
      const r0 = offsetToRect(lineStartOffset + lo);
      const r1 = offsetToRect(lineStartOffset + lo + 1);
      if (Math.abs(r1.x - relX) < Math.abs(r0.x - relX)) lo++;
    }
    return lineStartOffset + lo;
  }

  // Wrap path: offsetToRect returns y in viewport coords (already scroll-adjusted).
  // Convert mouse to the same space: viewport-relative y = e.clientY - taRect.top
  const taRect = mdInput.getBoundingClientRect();
  const vpRelY = e.clientY - taRect.top;

  // Binary search: find offset whose viewport-y is just <= vpRelY
  let lo = 0, hi = total;
  while (lo < hi) {
    const mid  = (lo + hi + 1) >> 1;
    const rect = offsetToRect(mid);
    if (rect.y <= vpRelY) lo = mid; else hi = mid - 1;
  }
  // Find the visual line boundaries at lo
  const targetY = offsetToRect(lo).y;
  let lineStart = lo;
  while (lineStart > 0 && offsetToRect(lineStart - 1).y >= targetY) lineStart--;
  let lineEnd = lo;
  while (lineEnd < total && offsetToRect(lineEnd).y <= targetY) lineEnd++;
  // Binary search within visual line for closest X
  lo = lineStart; hi = lineEnd;
  while (lo < hi) {
    const mid  = (lo + hi + 1) >> 1;
    const rect = offsetToRect(mid);
    if (rect.x <= relX) lo = mid; else hi = mid - 1;
  }
  if (lo < lineEnd) {
    const r0 = offsetToRect(lo);
    const r1 = offsetToRect(lo + 1);
    if (Math.abs(r1.x - relX) < Math.abs(r0.x - relX)) lo++;
  }
  return Math.min(lo, total);
}

// ── Alt+Click: add cursor ────────────────────────────────────
mdInput.addEventListener('mousedown', (e) => {
  if (!e.altKey) {
    // Regular click: clear all extra cursors
    if (mcCursors.length) clearMC();
    return;
  }
  e.preventDefault();
  const offset = mouseEventToOffset(e);

  // On the very first Alt+Click, capture the current native caret as cursor #0
  if (!mcCursors.length) {
    const nativeCaret = mdInput.selectionStart;
    mcCursors.push({ start: nativeCaret, end: mdInput.selectionEnd });
    mcActive = 0;
  }

  // Toggle: remove if already there, else add
  const existing = mcCursors.findIndex(c => c.start === offset && c.end === offset);
  if (existing !== -1) {
    mcCursors.splice(existing, 1);
    if (!mcCursors.length) { clearMC(); return; }
    mcActive = Math.min(mcActive, mcCursors.length - 1);
  } else {
    mcCursors.push({ start: offset, end: offset });
    mcActive = mcCursors.length - 1;
  }

  // Keep the native caret on cursor #0 (the original position)
  // so the primary cursor stays put — only the overlay shows the new ones
  const primary = mcCursors[0];
  mdInput.focus();
  mdInput.setSelectionRange(primary.start, primary.end);
  renderMCOverlay();
});

// Redraw overlay on scroll (cursor positions shift)
mdInput.addEventListener('scroll', throttle(() => { if (mcCursors.length) renderMCOverlay(); }, 16));
window.addEventListener('resize',  throttle(() => { if (mcCursors.length) renderMCOverlay(); }, 100));

// ── Ctrl+Alt+↑/↓: add cursor above/below ────────────────────
function addCursorAboveBelow(dir) {
  const ref   = mcCursors.length ? mcCursors[0] : { start: mdInput.selectionStart, end: mdInput.selectionEnd };
  const val   = mdInput.value;
  const lines = val.split('\n');
  let pos = 0, row = 0;
  for (let i = 0; i < lines.length; i++) {
    if (pos + lines[i].length >= ref.start) { row = i; break; }
    pos += lines[i].length + 1;
  }
  const col       = ref.start - pos;
  const targetRow = row + dir;
  if (targetRow < 0 || targetRow >= lines.length) return;
  let newPos = 0;
  for (let i = 0; i < targetRow; i++) newPos += lines[i].length + 1;
  newPos += Math.min(col, lines[targetRow].length);
  // Capture original caret as cursor #0 on first use
  if (!mcCursors.length) mcCursors.push({ start: ref.start, end: ref.end });
  mcCursors.push({ start: newPos, end: newPos });
  mcActive = mcCursors.length - 1;
  // Keep native caret on cursor #0 so original position stays put
  mdInput.setSelectionRange(mcCursors[0].start, mcCursors[0].end);
  renderMCOverlay();
}

// ── Ctrl+D: add next occurrence ──────────────────────────────
function addNextOccurrence() {
  const val = mdInput.value;
  const s   = mdInput.selectionStart;
  const e   = mdInput.selectionEnd;
  let word, searchFrom, ws;
  if (s === e) {
    const left  = val.slice(0, s).match(/\w+$/);
    const right = val.slice(s).match(/^\w+/);
    if (!left && !right) return;
    word = (left ? left[0] : '') + (right ? right[0] : '');
    ws   = s - (left ? left[0].length : 0);
    searchFrom = ws + word.length;
    if (!mcCursors.length) mcCursors.push({ start: ws, end: ws + word.length });
  } else {
    word = val.slice(s, e);
    searchFrom = e;
    if (!mcCursors.length) mcCursors.push({ start: s, end: e });
  }
  let idx = val.indexOf(word, searchFrom);
  if (idx === -1) idx = val.indexOf(word, 0);
  if (idx === -1 || mcCursors.some(c => c.start === idx)) return;
  mcCursors.push({ start: idx, end: idx + word.length });
  mcActive = mcCursors.length - 1;
  // Keep native caret on cursor #0
  mdInput.setSelectionRange(mcCursors[0].start, mcCursors[0].end);
  renderMCOverlay();
  showToast(mcCursors.length + ' selections');
}

// ── Ctrl+Shift+L: select all occurrences of selection ────────
function selectAllOccurrences() {
  const val = mdInput.value;
  const s   = mdInput.selectionStart;
  const e   = mdInput.selectionEnd;
  if (s === e) return;
  const word = val.slice(s, e);
  mcCursors  = [];
  let idx = 0;
  while ((idx = val.indexOf(word, idx)) !== -1) {
    mcCursors.push({ start: idx, end: idx + word.length });
    idx += word.length;
  }
  if (!mcCursors.length) return;
  mcActive = 0;
  mdInput.setSelectionRange(mcCursors[0].start, mcCursors[0].end);
  renderMCOverlay();
  showToast(mcCursors.length + ' selections');
}

// ── Ctrl+F2: select all occurrences of word under cursor ─────
function selectAllOccurrencesOfWord() {
  const val   = mdInput.value;
  const s     = mdInput.selectionStart;
  const left  = val.slice(0, s).match(/\w+$/);
  const right = val.slice(s).match(/^\w+/);
  if (!left && !right) return;
  const word = (left ? left[0] : '') + (right ? right[0] : '');
  const escaped = word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const re   = new RegExp('\\b' + escaped + '\\b', 'g');
  mcCursors  = [];
  let m;
  while ((m = re.exec(val)) !== null) {
    mcCursors.push({ start: m.index, end: m.index + m[0].length });
  }
  if (!mcCursors.length) return;
  mcActive = 0;
  mdInput.setSelectionRange(mcCursors[0].start, mcCursors[0].end);
  renderMCOverlay();
  showToast(mcCursors.length + ' selections');
}

// ── Multi-cursor typing (capture phase, runs first) ──────────
mdInput.addEventListener('keydown', (e) => {
  if (!mcCursors.length) return;
  if (e.key === 'Escape') { clearMC(); return; }

  const isPrintable = e.key.length === 1 && !e.ctrlKey && !e.metaKey;
  const isEdit = isPrintable || e.key === 'Backspace' || e.key === 'Delete' || e.key === 'Enter' || e.key === 'Tab';
  if (!isEdit) return;

  e.preventDefault();
  const val = mdInput.value;

  // Sort descending by end position so earlier edits don't shift later offsets
  const order = mcCursors
    .map((c, i) => ({ c, i }))
    .sort((a, b) => Math.max(b.c.start, b.c.end) - Math.max(a.c.start, a.c.end));

  let newVal     = val;
  const updated  = mcCursors.map(c => ({ ...c }));

  order.forEach(({ c: cur, i: idx }) => {
    const s   = Math.min(cur.start, cur.end);
    const en  = Math.max(cur.start, cur.end);
    const sel = en - s;
    let ins = '';
    if      (e.key === 'Enter')     ins = '\n';
    else if (e.key === 'Tab')       ins = '  ';
    else if (e.key.length === 1)    ins = e.key;

    if (sel > 0) {
      // Replace selection
      newVal = newVal.slice(0, s) + ins + newVal.slice(en);
      const delta = ins.length - sel;
      updated[idx] = { start: s + ins.length, end: s + ins.length };
      updated.forEach((c, i) => { if (i !== idx && c.start > s) { updated[i] = { start: c.start + delta, end: c.end + delta }; } });
    } else if (e.key === 'Backspace') {
      if (s > 0) {
        newVal = newVal.slice(0, s - 1) + newVal.slice(s);
        updated[idx] = { start: s - 1, end: s - 1 };
        updated.forEach((c, i) => { if (i !== idx && c.start >= s) { updated[i] = { start: c.start - 1, end: c.end - 1 }; } });
      }
    } else if (e.key === 'Delete') {
      if (s < newVal.length) {
        newVal = newVal.slice(0, s) + newVal.slice(s + 1);
        updated.forEach((c, i) => { if (i !== idx && c.start > s) { updated[i] = { start: c.start - 1, end: c.end - 1 }; } });
      }
    } else if (ins) {
      newVal = newVal.slice(0, s) + ins + newVal.slice(s);
      updated[idx] = { start: s + ins.length, end: s + ins.length };
      updated.forEach((c, i) => { if (i !== idx && c.start >= s) { updated[i] = { start: c.start + ins.length, end: c.end + ins.length }; } });
    }
  });

  mdInput.value = newVal;
  mcCursors = updated;
  // Always keep native caret on cursor #0 (the original/primary position)
  const primary = mcCursors[0] || mcCursors[mcActive];
  mdInput.setSelectionRange(primary.start, primary.end);
  renderMCOverlay();
  scheduleGutter();
  clearTimeout(renderTimer); renderTimer = setTimeout(render, 250);
}, true);

// ── All keyboard shortcuts ────────────────────────────────────
mdInput.addEventListener('keydown', (e) => {
  const ctrl  = e.ctrlKey || e.metaKey;
  const shift = e.shiftKey;
  const alt   = e.altKey;
  const key   = e.key;

  // ── Escape: close panels / clear cursors ──
  if (key === 'Escape') {
    if (findPanel.classList.contains('open')) { closeFind(); return; }
    if (gotoPanel.classList.contains('open')) { closeGoto(); return; }
    if (mcCursors.length) { clearMC(); return; }
  }

  // ── Ctrl+F: Find ──
  if (ctrl && !shift && !alt && key === 'f') { e.preventDefault(); openFind(false); return; }
  // ── Ctrl+H: Replace ──
  if (ctrl && !shift && !alt && key === 'h') { e.preventDefault(); openFind(true); return; }
  // ── F3 / Shift+F3: Find next/prev ──
  if (key === 'F3' && !ctrl && !alt) {
    e.preventDefault();
    if (!findPanel.classList.contains('open')) openFind(false);
    findNav(shift ? -1 : 1); return;
  }
  // ── Alt+Enter: Select all occurrences of find match ──
  if (alt && !ctrl && !shift && key === 'Enter' && findPanel.classList.contains('open')) {
    e.preventDefault();
    runFind();
    if (!findMatches.length) return;
    mcCursors = findMatches.map(m => ({ start: m.start, end: m.end }));
    mcActive  = 0;
    mdInput.setSelectionRange(findMatches[0].start, findMatches[0].end);
    renderMCOverlay();
    closeFind();
    showToast(findMatches.length + ' selections');
    return;
  }
  // ── Ctrl+G: Go to line ──
  if (ctrl && !shift && !alt && key === 'g') { e.preventDefault(); openGoto(); return; }
  // ── Alt+Z: Word wrap ──
  if (alt && !ctrl && !shift && (key === 'z' || key === 'Z')) { e.preventDefault(); btnWordwrap.click(); return; }
  // ── Ctrl+Home: Beginning of file ──
  if (ctrl && !shift && !alt && key === 'Home') {
    e.preventDefault(); mdInput.setSelectionRange(0, 0); mdInput.scrollTop = 0; scheduleGutter(); return;
  }
  // ── Ctrl+End: End of file ──
  if (ctrl && !shift && !alt && key === 'End') {
    e.preventDefault();
    const len = mdInput.value.length;
    mdInput.setSelectionRange(len, len); mdInput.scrollTop = mdInput.scrollHeight; scheduleGutter(); return;
  }
  // ── Ctrl+↑: Scroll line up ──
  if (ctrl && !shift && !alt && key === 'ArrowUp') {
    e.preventDefault(); mdInput.scrollTop = Math.max(0, mdInput.scrollTop - getLineHeightFast()); scheduleGutter(); return;
  }
  // ── Ctrl+↓: Scroll line down ──
  if (ctrl && !shift && !alt && key === 'ArrowDown') {
    e.preventDefault(); mdInput.scrollTop = Math.min(mdInput.scrollHeight, mdInput.scrollTop + getLineHeightFast()); scheduleGutter(); return;
  }
  // ── Alt+PgUp: Scroll page up ──
  if (alt && !ctrl && !shift && key === 'PageUp') {
    e.preventDefault(); mdInput.scrollTop = Math.max(0, mdInput.scrollTop - mdInput.clientHeight); scheduleGutter(); return;
  }
  // ── Alt+PgDn: Scroll page down ──
  if (alt && !ctrl && !shift && key === 'PageDown') {
    e.preventDefault(); mdInput.scrollTop = Math.min(mdInput.scrollHeight, mdInput.scrollTop + mdInput.clientHeight); scheduleGutter(); return;
  }
  // ── Ctrl+D: Add next occurrence ──
  if (ctrl && !shift && !alt && key === 'd') { e.preventDefault(); addNextOccurrence(); return; }
  // ── Ctrl+Shift+L: Select all occurrences of selection ──
  if (ctrl && shift && !alt && (key === 'l' || key === 'L')) { e.preventDefault(); selectAllOccurrences(); return; }
  // ── Ctrl+F2: Select all occurrences of word ──
  if (ctrl && !shift && !alt && key === 'F2') { e.preventDefault(); selectAllOccurrencesOfWord(); return; }
  // ── Ctrl+Alt+↑: Add cursor above ──
  if (ctrl && alt && !shift && key === 'ArrowUp') { e.preventDefault(); addCursorAboveBelow(-1); return; }
  // ── Ctrl+Alt+↓: Add cursor below ──
  if (ctrl && alt && !shift && key === 'ArrowDown') { e.preventDefault(); addCursorAboveBelow(1); return; }
  // ── Ctrl+U: Undo last cursor ──
  if (ctrl && !shift && !alt && key === 'u') {
    if (mcCursors.length) { e.preventDefault(); mcCursors.pop(); if (!mcCursors.length) { clearMC(); } else { mcActive = mcCursors.length - 1; const p = mcCursors[mcActive]; mdInput.setSelectionRange(p.start, p.end); renderMCOverlay(); } return; }
  }
  // ── Shift+Alt+I: Cursor at end of each selected line ──
  if (alt && shift && !ctrl && (key === 'i' || key === 'I')) {
    e.preventDefault();
    const selStart = mdInput.selectionStart, selEnd = mdInput.selectionEnd;
    if (selStart === selEnd) return;
    const selected = mdInput.value.slice(selStart, selEnd).split('\n');
    mcCursors = [];
    let off = selStart;
    selected.forEach(line => {
      mcCursors.push({ start: off + line.length, end: off + line.length });
      off += line.length + 1;
    });
    mcActive = 0;
    // Keep native caret on cursor #0
    mdInput.setSelectionRange(mcCursors[0].start, mcCursors[0].end);
    renderMCOverlay();
    showToast(mcCursors.length + ' cursors');
    return;
  }
  // ── Ctrl+Shift+\: Jump to matching bracket ──
  if (ctrl && shift && !alt && key === '\\') {
    e.preventDefault();
    const val   = mdInput.value;
    const pos   = mdInput.selectionStart;
    const OPEN  = '([{';
    const CLOSE = ')]}';
    let sc, mc2, dir, sp;
    const ch = val[pos], cp = val[pos - 1];
    if      (OPEN.includes(ch))  { sc = ch;  mc2 = CLOSE[OPEN.indexOf(ch)];   dir =  1; sp = pos; }
    else if (CLOSE.includes(ch)) { sc = ch;  mc2 = OPEN[CLOSE.indexOf(ch)];   dir = -1; sp = pos; }
    else if (OPEN.includes(cp))  { sc = cp;  mc2 = CLOSE[OPEN.indexOf(cp)];   dir =  1; sp = pos - 1; }
    else if (CLOSE.includes(cp)) { sc = cp;  mc2 = OPEN[CLOSE.indexOf(cp)];   dir = -1; sp = pos - 1; }
    else return;
    let depth = 0, i = sp;
    while (i >= 0 && i < val.length) {
      if (val[i] === sc) depth++;
      else if (val[i] === mc2) { depth--; if (depth === 0) { mdInput.setSelectionRange(i, i); scheduleGutter(); return; } }
      i += dir;
    }
    return;
  }
  scheduleGutter();
});
